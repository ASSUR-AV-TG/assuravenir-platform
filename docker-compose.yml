version: '3.8'
services:
  web:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    depends_on:
      - db
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: apprenant
    volumes:
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
